name: Release

# 2026-10-06：只發佈 Linux。進程組回收、/proc 身分驗證與 bwrap 隔離皆依賴 Linux。
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "要補上執行檔的既有 tag（v1.1.0 起；tag 須含 scripts/release/build-archives.sh）"
        required: true

permissions:
  contents: write

jobs:
  binaries:
    name: Build & Upload Linux Binaries
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 2026-10-09：issue-45，建置與 version 注入集中於腳本，與測試共用同一契約。
      - name: Build archives
        run: sh scripts/release/build-archives.sh "${TAG}" "$(git rev-parse HEAD)" dist

      - name: Upload to release
        run: |
          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            awk -v tag="${TAG}" '$0 ~ "^## \\[" tag "\\]" {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > notes.md
            gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file notes.md
          fi
          # 2026-10-09：issue-45，已發佈 asset 不可覆寫；重新發佈需先手動刪除舊 asset。
          gh release upload "${TAG}" dist/*.tar.gz "dist/asura_${TAG}_checksums.txt"
