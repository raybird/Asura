name: CI

on:
  push:
    branches: [ main, "issue-*" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Pinned OpenCode 1.18.23
        run: npm install -g opencode-ai@1.18.23

      # 2026-11-03：OpenCode 寫入角色的 HOME overlay 需要 bwrap 0.10 以上（#75），ubuntu-24.04 的套件只有 0.9.0；
      # 改從固定雜湊的 release 原始碼建置，裝在 /usr/bin，下方 AppArmor profile 才對得上。
      - name: Install bubblewrap and verify namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev pkg-config
          curl -sSfL -o "$RUNNER_TEMP/bubblewrap.tar.xz" https://github.com/containers/bubblewrap/releases/download/v0.11.1/bubblewrap-0.11.1.tar.xz
          echo "c1b7455a1283b1295879a46d5f001dfd088c0bb0f238abb5e128b3583a246f71  $RUNNER_TEMP/bubblewrap.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/bubblewrap.tar.xz" -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/bwrap-build" "$RUNNER_TEMP/bubblewrap-0.11.1" --prefix=/usr -Dman=disabled -Dtests=false -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          ninja -C "$RUNNER_TEMP/bwrap-build"
          sudo ninja -C "$RUNNER_TEMP/bwrap-build" install
          bwrap --version
          # 2026-09-30: Ubuntu restricts unprivileged user namespaces; allow only bwrap.
          sudo tee /etc/apparmor.d/asura-ci-bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile asura-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/asura-ci-bwrap
          bwrap --unshare-pid --unshare-ipc --ro-bind / / --proc /proc --die-with-parent -- /usr/bin/true
          bwrap --unshare-pid --ro-bind / / --overlay-src "$HOME" --tmp-overlay "$HOME" -- /usr/bin/true

      - name: Vet
        run: go vet ./...

      - name: Test with Race Detector
        run: go test -count=1 -race -v ./...

      # 2026-10-01：性能門檻獨立執行，避免 race instrumentation 影響耗時。
      - name: Lifecycle performance probe
        run: /usr/bin/time -v go test -tags lifecycleperf -count=1 -timeout 2m -run '^TestLifecycleLargeDataProbe$' -v ./internal/storage

      - name: Web memory UI probe
        run: |
          node docs/issues/issue-21/evidence/ui-probe.cjs
          node docs/issues/issue-21/evidence/ui-probe.cjs audit
          node docs/issues/issue-21/evidence/ui-probe.cjs taskRace
          node docs/issues/issue-21/evidence/ui-probe.cjs retry503

      - name: Web Git memory browser probe
        env:
          NODE_PATH: ${{ runner.temp }}/asura-browser/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/asura-browser" playwright@1.50.1
          "$RUNNER_TEMP/asura-browser/node_modules/.bin/playwright" install --with-deps chromium
          node docs/issues/issue-27/evidence/ui-browser.cjs

      - name: Build CLI
        run: go build -v ./cmd/asura
