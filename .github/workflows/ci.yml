name: CI

on:
  push:
    branches: [ main, "issue-*" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Pinned OpenCode 1.18.23
        run: npm install -g opencode-ai@1.18.23

      - name: Install bubblewrap and verify namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --unshare-pid --unshare-ipc --ro-bind / / --proc /proc --die-with-parent -- /usr/bin/true

      - name: Vet
        run: go vet ./...

      - name: Test with Race Detector
        run: go test -count=1 -race -v ./...

      - name: Web memory UI probe
        run: |
          node docs/issues/issue-21/evidence/ui-probe.cjs
          node docs/issues/issue-21/evidence/ui-probe.cjs audit
          node docs/issues/issue-21/evidence/ui-probe.cjs taskRace
          node docs/issues/issue-21/evidence/ui-probe.cjs retry503

      - name: Build CLI
        run: go build -v ./cmd/asura
